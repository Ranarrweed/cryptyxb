<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTYX // EMAIL WIPER</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --cyan: #00ffff;
            --bg-color: #020202;
            --panel-bg: rgba(0, 5, 0, 0.85);
            --error-red: #ff3333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--neon-green);
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #matrix {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            opacity: 0.3;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            background: var(--panel-bg);
            border: 1px solid var(--neon-green);
            border-radius: 4px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2), inset 0 0 30px rgba(0, 255, 65, 0.05);
            position: relative;
            backdrop-filter: blur(5px);
        }

        .terminal-header {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            position: absolute;
            top: 15px;
            left: 15px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.red { background: #ff5f56; box-shadow: 0 0 5px #ff5f56; }
        .dot.yellow { background: #ffbd2e; box-shadow: 0 0 5px #ffbd2e; }
        .dot.green { background: #27c93f; box-shadow: 0 0 5px #27c93f; }

        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 40px;
        }
        .glitch {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            position: relative;
            display: inline-block;
            letter-spacing: 3px;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--panel-bg);
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--cyan);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #ff00ff;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 50% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(5% 0 80% 0); }
        }

        .form-group {
            margin-bottom: 30px;
            position: relative;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--cyan);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        label span { color: var(--neon-green); }
        input {
            width: 100%;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.3);
            color: var(--neon-green);
            padding: 16px;
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            border-radius: 4px;
        }
        input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            background: rgba(0, 255, 65, 0.1);
        }
        input::placeholder { color: rgba(0, 255, 65, 0.3); }

        /* PROGRESS BAR */
        .progress-container {
            margin-bottom: 25px;
            width: 100%;
            height: 24px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: none; /* Hidden by default */
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
            transition: width 0.3s ease-out, background-color 0.3s ease;
            position: relative;
        }

        /* Striped animation for the bar */
        .progress-bar::after {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-image: linear-gradient(
                -45deg,
                rgba(0, 0, 0, 0.15) 25%,
                transparent 25%,
                transparent 50%,
                rgba(0, 0, 0, 0.15) 50%,
                rgba(0, 0, 0, 0.15) 75%,
                transparent 75%,
                transparent
            );
            background-size: 20px 20px;
            animation: move-stripes 1s linear infinite;
        }

        @keyframes move-stripes {
            0% { background-position: 0 0; }
            100% { background-position: 20px 0; }
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8rem;
            font-weight: bold;
            color: #000;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            z-index: 2;
            letter-spacing: 1px;
        }

        .progress-container.error .progress-bar { background: var(--error-red); box-shadow: 0 0 15px var(--error-red); }
        .progress-container.error { border-color: var(--error-red); }
        .progress-container.error .progress-text { color: #fff; }

        /* Button */
        .btn-container { position: relative; }
        button {
            width: 100%;
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2), inset 0 0 10px rgba(0, 255, 65, 0.1);
        }
        button:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.8);
        }
        button:active { transform: scale(0.98); }
        button:disabled {
            border-color: #333;
            color: #333;
            background: transparent;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Console Output */
        .console {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 3px solid var(--neon-green);
            padding: 15px;
            font-size: 0.85rem;
            min-height: 100px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
        }
        .console .line { margin-bottom: 8px; }
        .console .error { color: var(--error-red); text-shadow: 0 0 5px var(--error-red); }
        .console .success { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); font-weight: bold; }
        .console .info { color: #888; }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--neon-green);
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <div class="scanlines"></div>

            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>

        <div class="header">
            <div class="glitch" data-text="CRYPTYX">CRYPTYX</div>
            <div style="font-size: 0.9rem; color: var(--cyan); letter-spacing: 5px; margin-top: 5px;">EMAIL WIPER</div>
        </div>

        <div class="form-group">
            <label><span>></span> AUTH_COOKIE</label>
            <input type="password" id="cookie" placeholder="_|WARNING:-DO-NOT-SHARE-THIS..." required>
        </div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
            <div class="progress-text" id="progress-text">0%</div>
        </div>

        <div class="btn-container">
            <button id="execute-btn" onclick="executeBeam()">
                EXECUTE WIPE
            </button>
        </div>
